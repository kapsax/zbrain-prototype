<style>
  :root{color-scheme:light}

  .gate{width:100%;max-width:380px}

  input:focus{outline:none;border-color:#c7d7ff;box-shadow:0 0 0 3px rgba(29,94,255,.1)}
  button{width:100%;margin-top:12px;padding:10px 15px;border:none;border-radius:9px;background:#1d5eff;color:#fff;
    font-family:inherit;font-weight:600;font-size:14px;cursor:pointer}
  button:hover{background:#1246c7}
  button:disabled{opacity:.6;cursor:not-allowed}
  .err{color:#dc2626;font-size:12.5px;margin-top:10px;display:none}
  .err.on{display:block}

</style>

const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key  = await crypto.subtle.deriveKey({name:'PBKDF2', salt:dec(SALT), iterations:ITER, hash:'SHA-256'},
                 base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf  = await crypto.subtle.decrypt({name:'AES-GCM', iv:dec(IV)}, key, dec(CT));
  return new TextDecoder().decode(buf);
}
function render(html){
  document.open(); document.write(html); document.close();
}
const f=document.getElementById('f'), pw=document.getElementById('pw'),
      err=document.getElementById('err'), go=document.getElementById('go');
f.addEventListener('submit', async e => {
  e.preventDefault(); err.classList.remove('on'); go.disabled=true; go.textContent='Unlocking…';
  try {
    const html = await unlock(pw.value);
    sessionStorage.setItem('zb_pw', pw.value);      // survive refresh within this tab session
    render(html);
  } catch {
    err.classList.add('on'); go.disabled=false; go.textContent='Unlock'; pw.select();
  }
});
// already unlocked in this session? go straight in
(async () => {
  const saved = sessionStorage.getItem('zb_pw');
  if (!saved) return;
  try { render(await unlock(saved)); } catch { sessionStorage.removeItem('zb_pw'); }
})();
</script>
